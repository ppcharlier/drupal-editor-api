editor_api.assets.index:
  path: '/api/editor/v1/assets/{container}'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\AssetsController::index' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.assets.show:
  # `{path}` du contrat vaut `{mid}/{basename}` ; on le déclare ici en deux
  # segments distincts plutôt qu'avec une exigence `path: '.+'` sur un seul
  # segment : le RouteProvider de Drupal indexe les routes par nombre de
  # segments littéraux du gabarit (RouteCompiler::compile()) et exige
  # `number_parts >= count($parts)` de l'URL entrante — une exigence regex ne
  # permet donc jamais à un unique segment {path} d'absorber un slash. Deux
  # segments littéraux, en revanche, correspondent exactement au nombre de
  # parties de l'URL entrante et sont retrouvés normalement.
  path: '/api/editor/v1/assets/{container}/{mid}/{basename}'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\AssetsController::show' }
  requirements: { _permission: 'access editor api', mid: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.assets.store:
  path: '/api/editor/v1/assets/{container}'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\AssetsController::store' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.assets.update:
  # Mêmes deux segments littéraux que `assets.show` : voir le commentaire de
  # cette route pour la raison (RouteCompiler ne peut pas faire absorber un
  # slash par un unique segment {path}).
  path: '/api/editor/v1/assets/{container}/{mid}/{basename}'
  methods: [PATCH]
  defaults: { _controller: '\Drupal\editor_api\Controller\AssetsController::update' }
  requirements: { _permission: 'access editor api', mid: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.assets.destroy:
  # Mêmes deux segments littéraux que `assets.show` : voir le commentaire de
  # cette route pour la raison (RouteCompiler ne peut pas faire absorber un
  # slash par un unique segment {path}).
  path: '/api/editor/v1/assets/{container}/{mid}/{basename}'
  methods: [DELETE]
  defaults: { _controller: '\Drupal\editor_api\Controller\AssetsController::destroy' }
  requirements: { _permission: 'access editor api', mid: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.media.show:
  # Un `<drupal-media data-entity-uuid="…">` ne donne QUE l'UUID : ni type, ni chemin. D'où une
  # route à part des `assets.*`, sans conteneur, ouverte à tous les types de média.
  path: '/api/editor/v1/media/{uuid}'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\MediaController::show' }
  # Minuscules seulement : le cœur écrit toujours ses UUID en bas de casse ; un motif plus large
  # ferait dépendre la réponse de la collation de la base (une majuscule y matcherait ou non).
  requirements: { _permission: 'access editor api', uuid: '[0-9a-f-]{36}' }
  options: { no_cache: TRUE, _auth: [editor_api] }
