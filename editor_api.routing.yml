# Routes du contrat /api/editor/v1 — ajoutées tâche par tâche.

editor_api.tokens.store:
  path: '/api/editor/v1/auth/tokens'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\TokensController::store' }
  requirements: { _access: 'TRUE' }
  options: { no_cache: TRUE }

editor_api.tokens.destroy_current:
  path: '/api/editor/v1/auth/tokens/current'
  methods: [DELETE]
  defaults: { _controller: '\Drupal\editor_api\Controller\TokensController::destroyCurrent' }
  requirements: { _user_is_logged_in: 'TRUE' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.me:
  path: '/api/editor/v1/me'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\MeController::show' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.config:
  path: '/api/editor/v1/config'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\ConfigController::show' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.blueprints.index:
  path: '/api/editor/v1/collections/{collection}/blueprints'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\BlueprintsController::index' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.blueprints.show:
  path: '/api/editor/v1/collections/{collection}/blueprints/{blueprint}'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\BlueprintsController::show' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.index:
  path: '/api/editor/v1/collections/{collection}/entries'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\EntriesController::index' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.show:
  path: '/api/editor/v1/entries/{id}'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\EntriesController::show' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.store:
  path: '/api/editor/v1/collections/{collection}/entries'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\EntriesController::store' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.update:
  path: '/api/editor/v1/entries/{id}'
  methods: [PATCH]
  defaults: { _controller: '\Drupal\editor_api\Controller\EntriesController::update' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.destroy:
  path: '/api/editor/v1/entries/{id}'
  methods: [DELETE]
  defaults: { _controller: '\Drupal\editor_api\Controller\EntriesController::destroy' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.publish:
  path: '/api/editor/v1/entries/{id}/published'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\PublishedController::store' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.entries.unpublish:
  path: '/api/editor/v1/entries/{id}/published'
  methods: [DELETE]
  defaults: { _controller: '\Drupal\editor_api\Controller\PublishedController::destroy' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.revisions.index:
  path: '/api/editor/v1/entries/{id}/revisions'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\RevisionsController::index' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.revisions.restore:
  path: '/api/editor/v1/entries/{id}/revisions/{revision}/restore'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\RevisionsController::restore' }
  requirements: { _permission: 'access editor api', id: '\d+' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.taxonomies.index:
  path: '/api/editor/v1/taxonomies'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\TaxonomiesController::index' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.terms.index:
  path: '/api/editor/v1/taxonomies/{taxonomy}/terms'
  methods: [GET]
  defaults: { _controller: '\Drupal\editor_api\Controller\TermsController::index' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.terms.store:
  path: '/api/editor/v1/taxonomies/{taxonomy}/terms'
  methods: [POST]
  defaults: { _controller: '\Drupal\editor_api\Controller\TermsController::store' }
  requirements: { _permission: 'access editor api' }
  options: { no_cache: TRUE, _auth: [editor_api] }

editor_api.terms.update:
  path: '/api/editor/v1/taxonomies/{taxonomy}/terms/{slug}'
